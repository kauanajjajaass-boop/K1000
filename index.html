<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineCatálogo Debug</title>
    <style>
        body { background-color: #0d0d0d; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        h1 { color: #e50914; font-size: 24px; text-align: center; }
        .debug-box { background: #300; color: #f88; padding: 15px; border-radius: 6px; margin: 15px 0; font-size: 12px; white-space: pre-wrap; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; padding: 5px 0; }
        .card { background: #181818; border: 2px solid #252525; border-radius: 6px; overflow: hidden; cursor: pointer; padding: 0 0 8px 0; width: 100%; text-align: center; }
        .card img { width: 100%; height: 180px; object-fit: cover; display: block; }
        .card-title { font-size: 11px; padding: 6px 4px 2px 4px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .card-info { font-size: 10px; color: #ffb400; }
    </style>
</head>
<body>

    <h1>🎬 CineCatálogo - Teste de Erro</h1>
    <!-- Caixa onde o erro vai aparecer se algo falhar -->
    <div class="debug-box" id="tela-erro">Iniciando teste de conexão...</div>

    <h2>🔥 Filmes Populares</h2>
    <div class="grid" id="grid-populares"></div>

    <script>
        var apiKey = '5f3bacc9c08f53d1aadc87726cc87d40';
        var urlPopulares = 'https://themoviedb.org' + apiKey + '&language=pt-BR&page=1';

        function mostrarErro(texto) {
            document.getElementById('tela-erro').innerText = texto;
        }

        var xhr = new XMLHttpRequest();
        xhr.open('GET', urlPopulares, true);
        
        xhr.onload = function () {
            if (xhr.status === 200) {
                try {
                    var dados = JSON.parse(xhr.responseText);
                    if (dados.results && dados.results.length > 0) {
                        document.getElementById('tela-erro').style.display = 'none'; // Sumir caixa se der certo
                        var container = document.getElementById('grid-populares');
                        
                        for (var i = 0; i < dados.results.length; i++) {
                            var item = dados.results[i];
                            var card = document.createElement('div');
                            card.className = 'card';
                            card.innerHTML = '<img src="https://tmdb.org' + item.poster_path + '">' +
                                             '<div class="card-title">' + item.title + '</div>' +
                                             '<div class="card-info">★ ' + item.vote_average.toFixed(1) + '</div>';
                            container.appendChild(card);
                        }
                    } else {
                        mostrarErro('A API respondeu, mas não retornou nenhum filme.');
                    }
                } catch (e) {
                    mostrarErro('Erro ao ler os dados do TMDB: ' + e.message);
                }
            } else {
                mostrarErro('Erro de conexão com o TMDB. Código do erro: ' + xhr.status);
            }
        };

        xhr.onerror = function () {
            mostrarErro('O navegador bloqueou a requisição de rede (CORS ou Sem Internet).');
        };

        xhr.send();
    </script>
</body>
</html>
