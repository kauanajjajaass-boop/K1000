<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineCatálogo Premium</title>
    <style>
        body { background-color: #0d0d0d; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        h1 { color: #e50914; font-size: 26px; text-align: center; margin: 10px 0 5px 0; text-transform: uppercase; }
        .subtitle { text-align: center; color: #777; font-size: 12px; margin-bottom: 20px; }
        h2 { color: #e5e5e5; font-size: 16px; margin: 30px 0 10px 0; border-left: 4px solid #e50914; padding-left: 10px; text-transform: uppercase; }
        .player-container { margin: 0 auto 20px auto; max-width: 800px; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 6px; border: 1px solid #222; }
        iframe { width: 100%; height: 100%; border: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; padding: 5px 0; }
        .card { background: #181818; border: 2px solid #252525; border-radius: 6px; overflow: hidden; cursor: pointer; padding: 0 0 8px 0; width: 100%; text-align: center; }
        .card img { width: 100%; height: 180px; object-fit: cover; display: block; }
        .card-title { font-size: 11px; padding: 6px 4px 2px 4px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .card-info { font-size: 10px; color: #ffb400; }
        .card:focus, .card:hover { border-color: #e50914; background: #282828; transform: scale(1.05); outline: none; }
    </style>
</head>
<body>

    <h1>🎬 CineCatálogo</h1>
    <div class="subtitle">Modo Super Compatível Ativo</div>

    <div class="player-container">
        <iframe id="main-player" src="about:blank" allowfullscreen></iframe>
    </div>

    <h2>🔥 Filmes Populares</h2>
    <div class="grid" id="grid-populares"></div>

    <h2>✨ Lançamentos</h2>
    <div class="grid" id="grid-lancamentos"></div>

    <h2>📺 Séries Populares</h2>
    <div class="grid" id="grid-series"></div>

    <script>
        var apiKey = '5f3bacc9c08f53d1aadc87726cc87d40';

        function darPlay(id, tipo) {
            var urlEmbed = (tipo === 'tv') 
                ? 'https://embed.su' + id 
                : 'https://embed.su' + id;
            document.getElementById('main-player').src = urlEmbed;
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        // Função que processa os Filmes Populares
        function tmdPopulares(dados) {
            montarGrid(dados, 'grid-populares', 'movie');
        }

        // Função que processa os Lançamentos
        function tmdLancamentos(dados) {
            montarGrid(dados, 'grid-lancamentos', 'movie');
        }

        // Função que processa as Séries
        function tmdSeries(dados) {
            montarGrid(dados, 'grid-series', 'tv');
        }

        function montarGrid(dados, elementoId, tipo) {
            var container = document.getElementById(elementoId);
            if (!dados || !dados.results) return;

            for (var i = 0; i < dados.results.length; i++) {
                (function() {
                    var item = dados.results[i];
                    var titulo = item.title || item.name;
                    var id = item.id;
                    
                    var card = document.createElement('button');
                    card.className = 'card';
                    card.onclick = function() { darPlay(id, tipo); };
                    
                    var imagemUrl = item.poster_path 
                        ? 'https://tmdb.org' + item.poster_path 
                        : 'https://placeholder.com';

                    card.innerHTML = '<img src="' + imagemUrl + '" alt="' + titulo + '">' +
                                     '<div class="card-title">' + titulo + '</div>' +
                                     '<div class="card-info">★ ' + (item.vote_average ? item.vote_average.toFixed(1) : '0.0') + '</div>';
                    container.appendChild(card);
                })();
            }
        }

        // Burlar o CORS criando tags de script dinâmicas (Método JSONP)
        function injetarScript(url) {
            var script = document.createElement('script');
            script.src = url;
            document.body.appendChild(script);
        }

        // Faz as chamadas contornando o bloqueio do navegador
        injetarScript('https://themoviedb.org' + apiKey + '&language=pt-BR&page=1&callback=tmdPopulares');
        injetarScript('https://themoviedb.org' + apiKey + '&language=pt-BR&page=1&callback=tmdLancamentos');
        injetarScript('https://themoviedb.org' + apiKey + '&language=pt-BR&page=1&callback=tmdSeries');
    </script>
</body>
</html>
